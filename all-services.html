<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>All Services — eServiceBD24</title><link rel="stylesheet" href="common.css"><style>*{box-sizing:border-box}body{margin:0;background:#f2f6ff;color:#142b4e;font-family:Arial,"Noto Sans Bengali",sans-serif}.wrap{max-width:1400px;margin:auto;padding:24px}.head{display:flex;justify-content:space-between;align-items:center;gap:12px}.search{padding:12px;border:1px solid #ccd9ed;border-radius:10px;min-width:260px}.cats{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.cats button,.pages button{padding:8px 12px;border:1px solid #cfdaec;border-radius:9px;background:#fff;cursor:pointer}.cats .active,.pages .active{background:#0868ff;color:#fff}.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}.tool{display:flex;flex-direction:column;gap:10px;min-height:110px;border-radius:13px;padding:12px;color:#fff;text-decoration:none;background:linear-gradient(125deg,#5938ec,#0878ec)}.tooltop{display:flex;gap:10px;align-items:center}.toolicon{display:grid;place-items:center;width:38px;height:38px;border:1px solid #ffffff66;border-radius:10px;background:#ffffff22}.tool h3{font-size:14px;margin:0 0 4px}.tool p{font-size:11px;margin:0}.go{background:#fff;color:#17345b;border-radius:18px;padding:7px 10px;font-size:11px;align-self:flex-start}.pages{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin:22px}.empty{text-align:center;padding:35px;color:#687890}@media(max-width:1050px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}@media(max-width:750px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.wrap{padding:14px}.head{align-items:stretch;flex-direction:column}.search{min-width:0;width:100%}}</style></head><body><main class="wrap"><div class="head"><div><h1>সব সার্ভিস</h1><p>ক্যাটাগরি বা সার্চ দিয়ে সার্ভিস খুঁজুন</p></div><input id="q" class="search" placeholder="সার্ভিস খুঁজুন..."></div><div class="cats" id="cats"></div><div class="grid" id="grid"></div><div class="empty" id="empty" hidden>কোনো সার্ভিস পাওয়া যায়নি।</div><div class="pages" id="pages"></div></main><script>const API="https://script.google.com/macros/s/AKfycbySP1uhavqH3VwJDdDq6i0xDtdVA_CJRERaGTZheM0BwMBX_ttnrFK_8Zc5_qa2gHk9pA/exec";let data=[],cat="All",page=1;const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));function drawCats(){let cs=["All",...new Set(data.filter(x=>x.active).map(x=>x.category||"Other"))];cats.innerHTML=cs.map(c=>'<button class="'+(c===cat?"active":"")+'" onclick="cat='+JSON.stringify(c)+';page=1;drawCats();draw()">'+esc(c==="All"?"সব ক্যাটাগরি":c)+'</button>').join("")}function draw(){let q=document.getElementById("q").value.toLowerCase().trim(),list=data.filter(x=>x.active&&(cat==="All"||(x.category||"Other")===cat)&&(x.title+" "+x.subtitle+" "+x.category).toLowerCase().includes(q)),max=Math.max(1,Math.ceil(list.length/20));if(page>max)page=max;grid.innerHTML=list.slice((page-1)*20,page*20).map(x=>'<a class="tool" href="'+esc(x.githubUrl||"#")+'"><div class="tooltop"><span class="toolicon">'+esc(x.icon||"✦")+'</span><div><h3>'+esc(x.title)+'</h3><p>'+esc(x.subtitle||"অনলাইন সার্ভিস")+'</p></div></div><span class="go">ব্যবহার করুন →</span></a>').join("");empty.hidden=!!list.length;pages.innerHTML="";if(max>1)for(let n=1;n<=max;n++){let b=document.createElement("button");b.textContent=n;if(n===page)b.className="active";b.onclick=()=>{page=n;draw();scrollTo({top:0,behavior:"smooth"})};pages.appendChild(b)}}q.addEventListener("input",()=>{page=1;draw()});let cb="esbdAll"+Date.now();window[cb]=r=>{data=r.pages||[];drawCats();draw();delete window[cb]};let sc=document.createElement("script");sc.src=API+"?api=1&action=getPages&callback="+cb;document.head.appendChild(sc)</script><script src="common.js" defer></script></body></html>
