ry).toLowerCase().includes(q)),max=Math.max(1,Math.ceil(list.length/20));if(page>max)page=max;grid.innerHTML=list.slice((page-1)*20,page*20).map(x=>'<a class="tool" href="'+esc(x.githubUrl||"#")+'"><div class="tooltop"><span class="toolicon">'+esc(x.icon||"✦")+'</span><div><h3>'+esc(x.title)+'</h3><p>'+esc(x.subtitle||"অনলাইন সার্ভিস")+'</p></div></div><span class="go">ব্যবহার করুন →</span></a>').join("");empty.hidden=!!list.length;pages.innerHTML="";if(max>1)for(let n=1;n<=max;n++){let b=document.createElement("button");b.textContent=n;if(n===page)b.className="active";b.onclick=()=>{page=n;draw();scrollTo({top:0,behavior:"smooth"})};pages.appendChild(b)}}q.addEventListener("input",()=>{page=1;draw()});let cb="esbdAll"+Date.now();window[cb]=r=>{data=r.pages||[];drawCats();draw();delete window[cb]};let sc=document.createElement("script");sc.src=API+"?api=1&action=getPages&callback="+cb;document.head.appendChild(sc)</script><script src="common.js" defer></script><footer id="esbd-shared-footer"><div class="copyright"><span class="esbd-footer-text">© 2026 eServiceBD24. All Rights Reserved.</span><span><a class="esbd-privacy-link" href="https://eservicebd24.github.io/privacy.html">Privacy Policy</a> · <a href="https://eservicebd24.github.io/">Home</a></span></div></footer></body></html>
