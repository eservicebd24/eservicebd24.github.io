<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>সব সার্ভিস — eServiceBD24</title>
<link rel="stylesheet" href="https://eservicebd24.github.io/common.css">
<style>
:root{--navy:#061a40;--blue:#086cff;--cyan:#28cdf5;--ink:#102b59;--muted:#657895}
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans Bengali",sans-serif;color:var(--ink);background:#edf5ff}a{text-decoration:none;color:inherit}
.hero{background:radial-gradient(ellipse at 80% 20%,#164de0 0,#082c7b 38%,#041735 100%);color:#fff;padding:40px 18px 65px;text-align:center;position:relative;overflow:hidden}.hero:before,.hero:after{content:"";position:absolute;border:1px solid #7edaff30;border-radius:50%;width:340px;height:340px;pointer-events:none}.hero:before{left:-140px;top:-180px}.hero:after{right:-120px;bottom:-240px}.hero-inner{max-width:1050px;margin:auto;position:relative;z-index:1}.eyebrow{display:inline-block;border-radius:30px;background:#ffffff17;border:1px solid #ffffff35;padding:8px 15px;color:#bdeaff;font-weight:700;font-size:13px}.hero h1{font-size:clamp(31px,5vw,49px);line-height:1.2;margin:14px 0 10px}.hero h1 span{color:#3bd8ff}.hero p{font-size:clamp(14px,2vw,17px);line-height:1.8;color:#e0edff;max-width:720px;margin:0 auto}
.wrap{max-width:1300px;margin:-35px auto 0;padding:0 18px 46px;position:relative;z-index:2}.panel{border:1px solid #fff;border-radius:22px;background:#fff;box-shadow:0 18px 50px #153e7815;padding:20px;margin-bottom:18px}.search-row{display:flex;gap:10px;align-items:center}.searchbox{display:flex;align-items:center;gap:10px;border:1px solid #d5e2f5;background:#f8fbff;border-radius:14px;padding:0 14px;flex:1;min-width:0}.searchbox span{font-size:20px;color:#4770a6}.searchbox input{width:100%;min-width:0;border:0;outline:0;background:transparent;padding:14px 0;font:inherit;color:#15345f}.count{font-size:13px;color:#657895;white-space:nowrap}.categorybar{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.categorybar button{border:1px solid #d5e2f5;background:#fff;color:#23446e;border-radius:30px;padding:9px 14px;font:inherit;font-size:13px;cursor:pointer}.categorybar button.active{background:#0969f8;border-color:#0969f8;color:white}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}.tool{min-width:0;display:flex;flex-direction:column;min-height:165px;border:1px solid #fff;border-radius:17px;padding:17px;background:#fff;box-shadow:0 8px 25px #173c7510;transition:transform .18s,box-shadow .18s}.tool:hover{transform:translateY(-3px);box-shadow:0 14px 30px #173c7520}.tooltop{display:flex;align-items:center;gap:12px}.toolicon{width:46px;height:46px;flex:0 0 46px;border-radius:15px;background:linear-gradient(140deg,#e1f3ff,#e7eaff);display:grid;place-items:center;font-size:25px}.tool h2{font-size:15px;line-height:1.4;margin:0 0 5px;color:#153e80}.tool p{font-size:13px;line-height:1.65;margin:0;color:#657895}.go{margin-top:auto;align-self:flex-start;background:#eef5ff;color:#075ee3;border-radius:30px;padding:9px 13px;font-size:12px;font-weight:800;margin-top:15px}.empty{display:none;text-align:center;padding:38px 12px;color:#657895}.pagination{display:flex;justify-content:center;align-items:center;gap:7px;flex-wrap:wrap;margin:22px 0 0}.pagination button{border:1px solid #d2def0;background:#fff;color:#234;border-radius:10px;padding:9px 13px;cursor:pointer}.pagination button.active{background:#0868ff;color:#fff;border-color:#0868ff}.pagination button:disabled{opacity:.4;cursor:not-allowed}.footnote{text-align:center;color:#71829d;font-size:12px;line-height:1.8;padding:10px 12px 0}
@media(max-width:1000px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:700px){.hero{padding:31px 14px 57px}.wrap{padding:0 11px 30px;margin-top:-27px}.panel{padding:13px;border-radius:17px}.search-row{align-items:stretch;flex-direction:column}.count{white-space:normal}.categorybar{gap:7px}.categorybar button{padding:8px 11px;font-size:12px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.tool{padding:12px;min-height:157px;border-radius:14px}.tooltop{align-items:flex-start;gap:9px}.toolicon{width:38px;height:38px;flex-basis:38px;border-radius:12px;font-size:21px}.tool h2{font-size:13px}.tool p{font-size:12px}.go{font-size:11px;padding:8px 10px}.hero h1{font-size:33px}}
@media(max-width:380px){.grid{grid-template-columns:1fr}.tool{min-height:0}.tooltop{align-items:center}.tool p{font-size:13px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="header-slot"></div>
<section class="hero"><div class="hero-inner"><span class="eyebrow">এক জায়গায় সব অনলাইন টুলস</span><h1>আমাদের <span>সব সার্ভিস</span></h1><p>আপনার প্রয়োজনীয় সার্ভিস খুঁজুন, ক্যাটাগরি নির্বাচন করুন এবং সহজেই ব্যবহার শুরু করুন।</p></div></section>
<main class="wrap">
<section class="panel">
<div class="search-row"><label class="searchbox"><span>⌕</span><input id="q" type="search" placeholder="সার্ভিসের নাম লিখে খুঁজুন..." autocomplete="off"></label><div class="count" id="count" aria-live="polite">সার্ভিস লোড হচ্ছে…</div></div>
<div class="categorybar" id="categorybar" aria-label="সার্ভিস ক্যাটাগরি"></div>
</section>
<section class="grid" id="grid" aria-live="polite"></section>
<div class="empty" id="empty">কোনো সার্ভিস পাওয়া যায়নি। অন্য নামে খুঁজে দেখুন।</div>
<div class="pagination" id="pagination"></div>
<div class="footnote">নতুন সার্ভিস যোগ হলে তালিকাটি স্বয়ংক্রিয়ভাবে আপডেট হবে।</div>
</main>
<div id="footer-slot"></div>
<script>
const API='https://script.google.com/macros/s/AKfycbySP1uhavqH3VwJDdDq6i0xDtdVA_CJRERaGTZheM0BwMBX_ttnrFK_8Zc5_qa2gHk9pA/exec';
const ROOT='https://eservicebd24.github.io/';
let pages=[],categories=[],selected='all',query='',current=1;const pageSize=24;
const $=id=>document.getElementById(id);
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function attr(s){return esc(s).replace(/`/g,'&#96;')}
function normalize(s){return String(s??'').toLocaleLowerCase('bn').trim()}
function getCats(){return [...new Set(pages.filter(p=>p.active!==false).map(p=>String(p.category||'অন্যান্য').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'bn'))}
function renderCategories(){const bar=$('categorybar');const list=['all',...categories];bar.innerHTML=list.map(c=>`<button type="button" class="${c===selected?'active':''}" data-cat="${attr(c)}">${c==='all'?'সব সার্ভিস':esc(c)}</button>`).join('');bar.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{selected=b.dataset.cat;current=1;renderCategories();renderPages()}))}
function renderPages(){const filtered=pages.filter(p=>p.active!==false&&(selected==='all'||String(p.category||'অন্যান্য').trim()===selected)&&normalize([p.title,p.subtitle,p.category,p.filename].join(' ')).includes(normalize(query)));const total=Math.max(1,Math.ceil(filtered.length/pageSize));if(current>total)current=total;const shown=filtered.slice((current-1)*pageSize,current*pageSize);$('grid').innerHTML=shown.map((p,i)=>{const colors=['#e7f3ff','#e9e8ff','#e2fbf4','#fff0df','#ffe8f0','#e6f8ff'];return `<a class="tool" href="${attr(p.githubUrl||'#')}" style="border-top:3px solid ${['#1477ff','#7a4dff','#0eae83','#ff8a26','#e64b85','#13a8c7'][((current-1)*pageSize+i)%6]}"><div class="tooltop"><span class="toolicon" style="background:${colors[((current-1)*pageSize+i)%colors.length]}">${esc(p.icon||'✦')}</span><div><h2>${esc(p.title||'অনলাইন সার্ভিস')}</h2><p>${esc(p.subtitle||'সহজ অনলাইন টুল')}</p></div></div><span class="go">ব্যবহার করুন →</span></a>`}).join('');$('empty').style.display=filtered.length?'none':'block';$('count').textContent=`মোট ${filtered.length}টি সার্ভিস`;const pg=$('pagination');pg.innerHTML='';if(total>1){const add=(label,n,disabled=false,active=false)=>{const b=document.createElement('button');b.textContent=label;b.disabled=disabled;if(active)b.className='active';b.addEventListener('click',()=>{current=n;renderPages();window.scrollTo({top:$('grid').getBoundingClientRect().top+window.scrollY-90,behavior:'smooth'})});pg.appendChild(b)};add('← আগের',Math.max(1,current-1),current===1);for(let n=1;n<=total;n++)add(String(n),n,false,n===current);add('পরের →',Math.min(total,current+1),current===total)}}
$('q').addEventListener('input',()=>{query=$('q').value;current=1;renderPages()});
async function loadSharedPart(file,slot,selector){const target=$(slot);try{const res=await fetch(ROOT+file,{cache:'no-cache'});if(!res.ok)throw new Error(file+' load '+res.status);const doc=new DOMParser().parseFromString(await res.text(),'text/html');const node=doc.querySelector(selector);if(!node)throw new Error('Missing '+selector);target.replaceChildren(document.importNode(node,true))}catch(e){console.error('Shared shell load failed:',e);target.dataset.loadError=String(e.message||e)}}
Promise.all([loadSharedPart('header.html','header-slot','#esbd-shared-header'),loadSharedPart('footer.html','footer-slot','#esbd-shared-footer')]);
function jsonp(action,cb){const name='esbd_'+action+'_'+Date.now();window[name]=data=>{try{delete window[name]}catch(e){};cb(data)};const s=document.createElement('script');s.src=API+'?api=1&action='+encodeURIComponent(action)+'&callback='+name;s.onerror=()=>{try{delete window[name]}catch(e){};$('count').textContent='সার্ভিস লোড করা যায়নি';$('empty').style.display='block'};document.head.appendChild(s)}
jsonp('getPages',r=>{if(!r||!r.ok){$('count').textContent='সার্ভিস লোড করা যায়নি';$('empty').style.display='block';return}pages=Array.isArray(r.pages)?r.pages:[];categories=getCats();renderCategories();renderPages()});
</script>
<script src="https://eservicebd24.github.io/common.js" defer></script>
</body></html>
