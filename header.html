<!-- eServiceBD24 Shared Header: desktop links + mobile menu, self-contained -->
<header id="esbd-shared-header" style="box-sizing:border-box;width:100%;background:linear-gradient(100deg,#041632,#062e70 65%,#172bc0);color:#fff;padding:12px clamp(14px,3vw,32px);font-family:Arial,sans-serif;position:relative;z-index:1000;">
  <style>
    #esbd-shared-header *{box-sizing:border-box}
    #esbd-shared-header .esbd-header-inner{max-width:1350px;margin:0 auto;display:flex;align-items:center;gap:18px;min-height:44px}
    #esbd-shared-header .esbd-brand{display:flex;align-items:center;gap:11px;color:#fff;text-decoration:none;font-weight:800;min-width:0;flex-shrink:0}
    #esbd-shared-header .esbd-logo{display:grid;place-items:center;width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#18c8ff,#087bff);font-size:25px;flex-shrink:0}
    #esbd-shared-header .esbd-brandtext{font-size:19px;line-height:1.2}
    #esbd-shared-header .esbd-brandtext small{display:block;font-size:11px;font-weight:500;color:#d8e6ff;margin-top:3px}
    #esbd-shared-header .esbd-desktop-nav{display:flex;align-items:center;justify-content:flex-end;gap:3px;margin-left:auto}
    #esbd-shared-header .esbd-desktop-nav a,#esbd-shared-header .esbd-mobile-nav a{display:block;color:#fff;text-decoration:none;padding:10px 12px;border-radius:8px;font-size:14px;font-weight:700;white-space:nowrap}
    #esbd-shared-header .esbd-desktop-nav a:hover,#esbd-shared-header .esbd-mobile-nav a:hover{background:#ffffff20}
    #esbd-shared-header .esbd-mobile-menu{display:none;position:relative;margin-left:auto}
    #esbd-shared-header .esbd-menu-button{border:1px solid #ffffff66;background:#ffffff12;color:#fff;border-radius:9px;padding:10px 13px;font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap}
    #esbd-shared-header .esbd-mobile-nav{display:none;position:absolute;right:0;top:calc(100% + 8px);min-width:200px;background:#101b3b;border:1px solid #ffffff30;border-radius:12px;padding:7px;box-shadow:0 12px 30px #0005}
    #esbd-shared-header .esbd-mobile-menu[open] .esbd-mobile-nav{display:block}
    #esbd-shared-header .esbd-mobile-menu summary{list-style:none}
    #esbd-shared-header .esbd-mobile-menu summary::-webkit-details-marker{display:none}
    @media(max-width:760px){
      #esbd-shared-header{padding:10px 13px!important}
      #esbd-shared-header .esbd-header-inner{gap:9px}
      #esbd-shared-header .esbd-brandtext{font-size:16px}
      #esbd-shared-header .esbd-logo{width:39px;height:39px;font-size:23px}
      #esbd-shared-header .esbd-desktop-nav{display:none!important}
      #esbd-shared-header .esbd-mobile-menu{display:block!important}
    }
  </style>
  <div class="esbd-header-inner">
    <a class="esbd-brand" href="https://eservicebd24.github.io/" aria-label="eServiceBD24 Home">
      <span class="esbd-logo" aria-hidden="true">☁</span>
      <span class="esbd-brandtext">eServiceBD24<small>All Online Tools in One Place</small></span>
    </a>
    <nav class="esbd-desktop-nav" aria-label="Main navigation">
      <a href="https://eservicebd24.github.io/">⌂ Home</a>
      <a href="https://eservicebd24.github.io/all-services.html">▦ All Services</a>
      <a href="https://eservicebd24.github.io/about.html">ⓘ About</a>
      <a href="https://eservicebd24.github.io/contact.html">✉ Contact</a>
    </nav>
    <details class="esbd-mobile-menu">
      <summary class="esbd-menu-button">☰ Menu</summary>
      <nav class="esbd-mobile-nav" aria-label="Mobile navigation">
        <a href="https://eservicebd24.github.io/">⌂ Home</a>
        <a href="https://eservicebd24.github.io/all-services.html">▦ All Services</a>
        <a href="https://eservicebd24.github.io/about.html">ⓘ About</a>
        <a href="https://eservicebd24.github.io/contact.html">✉ Contact</a>
      </nav>
    </details>
  </div>
</header>
